server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP → HTTPS (needed for camera/PWA)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL Certificates (replace with your paths) ──────────────────
    ssl_certificate     /etc/ssl/certs/your-domain.crt;
    ssl_certificate_key /etc/ssl/private/your-domain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Root directory ───────────────────────────────────────────────
    root /var/www/iq-enterprise;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(self), microphone=()"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Cache rules ──────────────────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    off;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    off;
    }

    location ~* \.(csv|pdf)$ {
        add_header Cache-Control "no-store";
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── Logging ──────────────────────────────────────────────────────
    access_log /var/log/nginx/iq-enterprise-access.log;
    error_log  /var/log/nginx/iq-enterprise-error.log;
}
